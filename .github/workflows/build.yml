name: Build & Release

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-core:
    name: "Build Core"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: core-dist
          path: dist/
          retention-days: 30

  build-installer-win:
    name: "Installer — Windows"
    needs: build-core
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: core-dist
          path: dist/
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: installer/package-lock.json
      - run: npm ci
        working-directory: installer
      - run: npm run build:win
        working-directory: installer
      - uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: installer/release/*.exe
          if-no-files-found: warn
          retention-days: 30

  build-installer-mac:
    name: "Installer — macOS"
    needs: build-core
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: core-dist
          path: dist/
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: installer/package-lock.json
      - run: npm ci
        working-directory: installer
      - run: npm run build:mac
        working-directory: installer
      - uses: actions/upload-artifact@v4
        with:
          name: installer-mac
          path: installer/release/*.dmg
          if-no-files-found: warn
          retention-days: 30

  deploy-site:
    name: "Deploy Landing Page"
    needs: build-core
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4

  release:
    name: "Create Release"
    needs: [build-core, build-installer-win, build-installer-mac]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/core-dist/patcher.js
            release/core-dist/renderer.js
            release/core-dist/preload.cjs
            release/installer-windows/*
            release/installer-mac/*
          generate_release_notes: true
