name: Build & Release

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - run: npm run build

      # Package Linux .deb
      - name: Build .deb
        run: |
          mkdir -p release/suncord_1.0.0_amd64/DEBIAN
          mkdir -p release/suncord_1.0.0_amd64/usr/lib/suncord
          mkdir -p release/suncord_1.0.0_amd64/usr/share/applications

          cat > release/suncord_1.0.0_amd64/DEBIAN/control << 'EOF'
          Package: suncord
          Version: 1.0.0
          Section: net
          Priority: optional
          Architecture: amd64
          Depends: discord
          Maintainer: SUNCORD Team
          Description: Discord client mod with drag-and-drop plugin store
          EOF

          cp -r dist/* release/suncord_1.0.0_amd64/usr/lib/suncord/
          cp scripts/suncord.sh release/suncord_1.0.0_amd64/usr/lib/suncord/
          chmod 755 release/suncord_1.0.0_amd64/usr/lib/suncord/suncord.sh

          cat > release/suncord_1.0.0_amd64/usr/share/applications/suncord.desktop << 'EOF'
          [Desktop Entry]
          Name=SUNCORD
          Exec=/usr/lib/suncord/suncord.sh launch
          Icon=suncord
          Type=Application
          Categories=Network;
          EOF

          dpkg-deb --build release/suncord_1.0.0_amd64 release/suncord_1.0.0_amd64.deb

      # Package portable zip (works on any OS)
      - name: Build portable zip
        run: |
          cd dist && zip -r ../release/suncord-portable.zip . && cd ..

      # Package Windows NSIS installer
      - name: Build Windows installer
        run: |
          sudo apt-get update && sudo apt-get install -y nsis
          makensis build/installer.nsi

      # Upload artifacts for this run
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: suncord-builds
          path: |
            release/*.deb
            release/*.zip
            suncord-setup.exe
          retention-days: 30

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: suncord-builds
          path: release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
