name: Build & Release

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-linux:
    name: "Linux Build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run build

      - name: Build .deb
        run: |
          mkdir -p release/suncord_1.0.0_amd64/DEBIAN
          mkdir -p release/suncord_1.0.0_amd64/usr/lib/suncord
          mkdir -p release/suncord_1.0.0_amd64/usr/share/applications
          cat > release/suncord_1.0.0_amd64/DEBIAN/control << 'DEBEOF'
          Package: suncord
          Version: 1.0.0
          Section: net
          Priority: optional
          Architecture: amd64
          Depends: discord
          Maintainer: SUNCORD Team
          Description: Discord client mod with drag-and-drop plugin store
          DEBEOF
          cp -r dist/* release/suncord_1.0.0_amd64/usr/lib/suncord/
          cp scripts/suncord.sh release/suncord_1.0.0_amd64/usr/lib/suncord/
          chmod 755 release/suncord_1.0.0_amd64/usr/lib/suncord/suncord.sh
          dpkg-deb --build release/suncord_1.0.0_amd64 release/suncord_1.0.0_amd64.deb

      - name: Build portable zip
        run: cd dist && zip -r ../release/suncord-portable.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: linux-builds
          path: release/*
          retention-days: 30

  build-windows:
    name: "Windows Build"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run build

      - name: Build portable zip
        run: |
          New-Item -ItemType Directory -Force -Path release
          Compress-Archive -Path dist/* -DestinationPath release/suncord-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows-builds
          path: release/*
          retention-days: 30

  deploy-site:
    name: "Deploy Landing Page"
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4

  release:
    name: "Create Release"
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/linux-builds/*
            release/windows-builds/*
          generate_release_notes: true
