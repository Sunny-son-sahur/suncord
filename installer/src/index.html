<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Suncord Installer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Title Bar -->
  <div class="titlebar" id="titlebar">
    <span class="titlebar-title">Suncord Installer</span>
    <div class="titlebar-controls">
      <button class="tb-btn tb-close" id="btnClose">✕</button>
    </div>
  </div>

  <!-- Main Content -->
  <div class="app" id="app">
    <!-- Loading state -->
    <div class="loading" id="loadingState">
      <p>Detecting Discord installations...</p>
    </div>

    <!-- Main installer UI (hidden until Discord is detected) -->
    <div class="installer hidden" id="installerUI">
      <!-- Install path info -->
      <div class="info-bar">
        <div class="info-row">
          <span>Files will be installed to:</span>
          <span class="path-link" id="installPath" title="Click to open"></span>
          <a class="open-dir" id="openDirBtn">Open Directory</a>
        </div>
        <div class="info-row">
          <span>Installer Version: <strong id="installerVersion">1.0.0</strong></span>
          <span>&nbsp;&nbsp;Loader Version: <strong id="loaderVersion">—</strong></span>
        </div>
      </div>

      <!-- Discord selection -->
      <div class="section">
        <p class="section-label">Please select an install to patch</p>
        <div class="discord-list" id="discordList">
          <!-- Populated by JS -->
        </div>
      </div>

      <!-- Custom location -->
      <div class="custom-location">
        <label class="radio-label">
          <input type="radio" name="discord-select" id="customRadio" value="custom">
          <span>Custom Install Location</span>
        </label>
        <input type="text" class="custom-path-input hidden" id="customPathInput" placeholder="Enter Discord path...">
      </div>

      <!-- Action buttons -->
      <div class="actions">
        <button class="btn btn-green" id="btnInstall">Install</button>
        <button class="btn btn-green-outline" id="btnInstallOpenAsar">Install OpenAsar</button>
        <button class="btn btn-red" id="btnUninstall">Uninstall</button>
        <button class="btn btn-blue" id="btnUpdate">Update</button>
      </div>

      <!-- Status bar -->
      <div class="status-bar" id="statusBar"></div>
    </div>

    <!-- No Discord found -->
    <div class="no-discord hidden" id="noDiscord">
      <p>Discord was not found on your system.</p>
      <p>Install Discord first, then run this installer again.</p>
      <button class="btn btn-blue" id="btnDownloadDiscord">Download Discord</button>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
